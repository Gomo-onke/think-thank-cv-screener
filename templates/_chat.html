<button id="chat-toggle" class="chat-toggle" type="button" aria-expanded="false" aria-controls="chat-panel">Questions? Chat with us</button>
<section id="chat-panel" class="chat-panel" aria-label="Frequently asked questions chat" hidden>
  <div class="chat-head">
    <div><b>{{ org_name }} assistant</b><small>Answers to common questions</small></div>
    <button id="chat-close" type="button" aria-label="Close chat">×</button>
  </div>
  <div id="chat-log" class="chat-log" aria-live="polite"></div>
  <form id="human-form" class="human-form" hidden autocomplete="off">
    <b>Talk to a recruiter</b>
    <input id="human-name" type="text" maxlength="100" placeholder="Your name" aria-label="Your name" required>
    <input id="human-email" type="email" maxlength="200" placeholder="Your email address" aria-label="Your email address" required>
    <textarea id="human-message" maxlength="1000" rows="3" placeholder="Your question" aria-label="Your question" required></textarea>
    <div class="row"><button class="btn primary sm" type="submit">Send to the team</button>
      <button class="btn sm" id="human-cancel" type="button">Cancel</button></div>
    <div id="human-error" class="small" role="alert" style="color:var(--red)"></div>
  </form>
  <p class="chat-note">Automated answers to frequent questions. Please do not share ID numbers or passwords here. <button id="human-open" class="chip" type="button" style="margin-top:.3rem">Talk to a recruiter</button></p>
  <form id="chat-form" class="chat-form" autocomplete="off">
    <input id="chat-input" type="text" maxlength="300" placeholder="Type your question…" aria-label="Your question" required>
    <button class="btn primary" type="submit">Send</button>
  </form>
</section>
<script src="{{ url_for('static', filename='chat.js') }}" defer></script>
